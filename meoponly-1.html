<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MEOPONLY</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  height:100%;
  background:#000;
  color:#fff;
  font-family:'Space Mono',monospace;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  cursor:crosshair;
}

.wordmark{
  font-size:clamp(1rem,3vw,1.4rem);
  letter-spacing:0.35em;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:48px;
  font-weight:400;
  opacity:0.9;
}

.search-wrap{
  width:min(580px,90vw);
  display:flex;
  border:1px solid #fff;
}

.search-wrap:focus-within{
  outline:1px solid #fff;
  outline-offset:3px;
}

#query{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-family:'Space Mono',monospace;
  font-size:0.9rem;
  padding:14px 18px;
  caret-color:#fff;
  letter-spacing:0.03em;
}

#query::placeholder{
  color:#555;
}

.search-btn{
  background:transparent;
  border:none;
  border-left:1px solid #fff;
  color:#fff;
  font-family:'Space Mono',monospace;
  font-size:0.75rem;
  letter-spacing:0.15em;
  padding:0 20px;
  cursor:pointer;
  transition:background 0.15s, color 0.15s;
  white-space:nowrap;
}

.search-btn:hover{
  background:#fff;
  color:#000;
}

/* RESULTS */
#results{
  width:min(580px,90vw);
  margin-top:32px;
}

.results-info{
  font-size:0.65rem;
  color:#555;
  letter-spacing:0.08em;
  margin-bottom:20px;
  text-transform:uppercase;
}

.result-item{
  margin-bottom:28px;
  animation:fadeUp 0.3s ease both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.result-domain{
  font-size:0.65rem;
  color:#555;
  letter-spacing:0.06em;
  margin-bottom:4px;
  text-transform:lowercase;
}

.result-title{
  display:block;
  font-size:0.85rem;
  color:#fff;
  text-decoration:none;
  letter-spacing:0.02em;
  line-height:1.4;
  margin-bottom:6px;
  font-weight:700;
}

.result-title:hover{
  text-decoration:underline;
  text-underline-offset:3px;
}

.result-snippet{
  font-size:0.75rem;
  color:#666;
  line-height:1.7;
  font-weight:400;
}

.pagination{
  display:flex;
  gap:2px;
  margin-top:36px;
  margin-bottom:60px;
}

.page-btn{
  background:transparent;
  border:1px solid #333;
  color:#666;
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
  padding:8px 14px;
  cursor:pointer;
  letter-spacing:0.1em;
  transition:all 0.1s;
}

.page-btn:hover,.page-btn.active{
  border-color:#fff;
  color:#fff;
}

.state{
  font-size:0.75rem;
  color:#444;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:40px 0;
}

.err{
  font-size:0.72rem;
  color:#555;
  line-height:1.8;
  padding:20px 0;
  letter-spacing:0.04em;
}
</style>
</head>
<body>

<span class="wordmark">meoponly</span>

<div class="search-wrap">
  <input id="query" type="text" placeholder="search" autocomplete="off" spellcheck="false"/>
  <button class="search-btn" onclick="doSearch(1)">go</button>
</div>

<div id="results"></div>

<script>
const API_KEY = 'AIzaSyAvKmzmw5UuMXIwww69TLAzJvWF20tYLRQ';
const CX      = '80810a729cb964c27';

const input   = document.getElementById('query');
const results = document.getElementById('results');

input.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(1); });

function hostname(url){
  try{ return new URL(url).hostname.replace('www.',''); }catch{ return url; }
}

async function doSearch(page){
  const q = input.value.trim();
  if(!q) return;

  results.innerHTML = `<div class="state">searching...</div>`;

  const start = (page-1)*10+1;
  const url = `https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${CX}&q=${encodeURIComponent(q)}&start=${start}`;

  try{
    const res  = await fetch(url);
    const data = await res.json();

    if(data.error){
      results.innerHTML = `<div class="err">error ${data.error.code} — ${data.error.message}</div>`;
      return;
    }

    if(!data.items?.length){
      results.innerHTML = `<div class="state">no results.</div>`;
      return;
    }

    const total = parseInt(data.searchInformation?.totalResults||0).toLocaleString();
    const time  = parseFloat(data.searchInformation?.searchTime||0).toFixed(2);

    let html = `<div class="results-info">${total} results &nbsp;·&nbsp; ${time}s</div>`;

    data.items.forEach((item, i) => {
      html += `
        <div class="result-item" style="animation-delay:${i*0.04}s">
          <div class="result-domain">${hostname(item.link)}</div>
          <a class="result-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
          <p class="result-snippet">${item.snippet||''}</p>
        </div>`;
    });

    const totalPages = Math.min(10, Math.ceil(Math.min(parseInt(data.searchInformation?.totalResults||0),100)/10));
    if(totalPages > 1){
      html += `<div class="pagination">`;
      if(page>1) html += `<button class="page-btn" onclick="doSearch(${page-1})">← prev</button>`;
      for(let p=1;p<=totalPages;p++){
        html += `<button class="page-btn${p===page?' active':''}" onclick="doSearch(${p})">${p}</button>`;
      }
      if(page<totalPages) html += `<button class="page-btn" onclick="doSearch(${page+1})">next →</button>`;
      html += `</div>`;
    }

    results.innerHTML = html;
    window.scrollTo({top:0,behavior:'smooth'});

  }catch(err){
    results.innerHTML = `<div class="err">failed — ${err.message}</div>`;
  }
}
</script>
</body>
</html>
